# Canonical term definitions. Keys are permanent (anchors: /glossary#<key>).
# `owner` is the chapter that explains the term in depth (may be planned).
# Definitions: one or two plain sentences, no circular references.

at-least-once-delivery:
  term: At-least-once delivery
  definition: A guarantee that every message is delivered one or more times; nothing is lost, but consumers must tolerate duplicates.
  owner: message-queues

backpressure:
  term: Backpressure
  definition: A mechanism by which a slower downstream component signals upstream producers to slow down, instead of buffering without bound.
  owner: message-queues

circuit-breaker:
  term: Circuit breaker
  definition: A guard around calls to a dependency that stops sending requests for a cool-down period after repeated failures, so a sick dependency is not overwhelmed and callers fail fast.

dead-letter-queue:
  term: Dead-letter queue (DLQ)
  definition: A separate queue that holds messages a consumer repeatedly failed to process, so they can be inspected without blocking healthy traffic.
  owner: message-queues

device-token:
  term: Device token
  definition: An opaque address issued by a push provider (APNs or FCM) that identifies one app installation on one device; it can change or become invalid at any time.

exponential-backoff:
  term: Exponential backoff
  definition: A retry policy that multiplies the wait between attempts (for example 1 s, 2 s, 4 s), usually with random jitter so many clients do not retry in lockstep.

fan-out:
  term: Fan-out
  definition: Delivering one logical event to many recipients or downstream consumers.
  owner: design-a-news-feed

fencing-token:
  term: Fencing token
  definition: A number that increases every time ownership of a resource changes; storage rejects any write carrying an older number, so a stale owner that wakes up late cannot act.

head-of-line-blocking:
  term: Head-of-line blocking
  definition: When work at the front of a queue is slow or stuck, everything behind it waits, even if that later work is urgent or would be fast.

idempotency-key:
  term: Idempotency key
  definition: A client-supplied unique identifier that lets a server recognize retries of the same request and apply its effect only once.
  owner: idempotency

p99:
  term: p99 latency
  definition: The latency below which 99% of requests complete; the slowest 1% take longer.
  owner: latency-and-throughput-numbers

qps:
  term: Queries per second (QPS)
  definition: The number of requests a system or component handles each second; we distinguish average from peak.
  owner: back-of-the-envelope-estimation

transactional-outbox:
  term: Transactional outbox
  definition: A pattern where a service writes outgoing messages to an outbox table in the same database transaction as its state change; a relay publishes them afterwards, so the two never disagree.

ttl:
  term: Time-to-live (TTL)
  definition: How long a piece of data remains valid before it expires and must be refreshed or discarded.
  owner: caching

aimd:
  term: Additive increase, multiplicative decrease (AIMD)
  definition: A rate-control rule that cuts the sending rate sharply (for example, in half) when it sees congestion or throttling, then raises it again in small steps; TCP uses it to find a network's real capacity.

apns:
  term: Apple Push Notification service (APNs)
  definition: Apple's service for delivering push notifications to iPhones, iPads, and Macs. It is the only way to reach an Apple device's notification center.

dau:
  term: Daily active users (DAU)
  definition: The number of distinct users who use a product on a given day; the usual starting point for sizing a system.

fcm:
  term: Firebase Cloud Messaging (FCM)
  definition: Google's service for delivering push notifications and data messages to Android devices, and also to iOS and web apps through their own channels.

jitter:
  term: Jitter
  definition: Randomness added to a delay so that many clients waiting the same amount of time do not all act at the same instant.

lease:
  term: Lease
  definition: A claim on a piece of work that expires on its own after a set time, so if the holder crashes, someone else can safely take the work over.

littles-law:
  term: Little's law
  definition: Requests in flight equal the arrival rate times the time each request takes. At 1,000 requests per second taking 0.1 s each, about 100 are in flight at any moment.

partition:
  term: Partition
  definition: A slice of a table or topic chosen by a key, such as a user id. All data with the same key lands in the same partition, which lives on one node and keeps its own order.

rpo:
  term: Recovery point objective (RPO)
  definition: How much recent data you can afford to lose in a disaster, measured as time; an RPO of a few seconds means the last few seconds of writes may be gone.

rto:
  term: Recovery time objective (RTO)
  definition: How long a system may take to come back after a disaster before the outage becomes unacceptable.

sms-segment:
  term: SMS segment
  definition: The unit carriers bill and rate-limit SMS by. One segment holds 160 plain-alphabet characters or 70 characters when the text needs emoji or non-Latin scripts; longer messages are split into several segments.

token-bucket:
  term: Token bucket
  definition: A rate limiter that adds tokens to a bucket at a steady rate and spends one per request; requests wait or are rejected when the bucket is empty, while short bursts can use saved-up tokens.

wide-column-store:
  term: Wide-column store
  definition: A distributed database, such as Cassandra or Bigtable, that groups rows into partitions by key and sorts them within each partition. It is built for very high write volume and fast reads of one partition's newest rows.

frequency-cap:
  term: Frequency cap
  definition: A per-user limit on how many notifications of a kind can be sent in a period, such as at most 3 marketing pushes a day; anything over the limit is dropped or deferred.

deduplication:
  term: Deduplication
  definition: Recognizing that a message has already been processed or sent, and dropping the repeat, so retries and producer bugs do not reach the user twice.

channel-escalation:
  term: Escalation across channels
  definition: Sending through a cheap channel first (such as push) and, if the user has not opened it within a set time, falling back to a costlier one (such as SMS).

delivery-tracking:
  term: Delivery tracking
  definition: Recording each notification's progress (queued, sent, delivered, opened, or failed) from provider callbacks and app receipts, so senders can see what happened to it.

throughput:
  term: Throughput
  definition: How much work a system completes per unit of time, such as notifications sent per second. It is a rate, not a speed; latency measures how long each item takes.

provider-handoff:
  term: Provider handoff
  definition: The moment our worker passes a notification to an outside provider (APNs, FCM, an email or SMS service) and the provider accepts it. From then on, delivery is in the provider's hands.

best-effort:
  term: Best-effort
  definition: No timing promise. The work is done as soon as spare capacity allows, after urgent traffic, so it may take minutes during busy periods.

ingestion-api:
  term: Ingestion API
  definition: The front door of the platform, the endpoint other services call to submit a notification. It only checks, records, and queues the request; delivery happens later, behind it.

availability-nines:
  term: Availability ("nines")
  definition: The share of time a service works as promised. 99.9% ("three nines") allows about 8.8 hours of downtime a year; 99.99% ("four nines") about 53 minutes.

http-202-accepted:
  term: 202 Accepted
  definition: An HTTP response meaning "received and queued, but not processed yet". The caller gets an id now and learns the outcome later.

suppression:
  term: Suppression
  definition: Deliberately not sending a notification because a rule says so, such as an opt-out, quiet hours, a frequency cap, or a duplicate. The reason is recorded so it can be explained later.

indeterminate-outcome:
  term: Indeterminate outcome
  definition: A send whose result nobody can know, for example when the connection to the provider drops after the request went out. We record it as indeterminate instead of guessing "sent" or "failed".

exactly-once-delivery:
  term: Exactly-once delivery
  definition: A guarantee that every message arrives one time, never zero and never twice. It is expensive inside one system and impossible end to end when the last step is a call to an outside provider.

global-ordering:
  term: Global ordering
  definition: A guarantee that every message is processed in the exact order it was created, across the whole system. It forces everything through one sequence, which limits scale.

template-versioning:
  term: Versioned template
  definition: A message template whose every change is saved as a new numbered version. Each notification records the version it used, so an edit never changes messages already queued and a bad edit can be rolled back.

localization:
  term: Localization
  definition: Adapting a message to the reader's language and region, including translation, date and number formats, and time zones.

personalization:
  term: Personalization (per-user data)
  definition: Filling a template's placeholders with values for one recipient, such as their name, order number, or one-time code, at the moment the message is rendered.

replay:
  term: Replay
  definition: Processing the same message a second time, for example when a worker crashes after doing the work but before recording that it finished. A replay carries the same notification id, so the system can recognize and drop it.

short-code:
  term: Short code
  definition: A 5- or 6-digit phone number (such as 72345) leased for high-volume business texting. Carriers vet it in advance, so it may send far faster than an ordinary number.

toll-free-number:
  term: Toll-free number
  definition: A 10-digit number with a toll-free prefix such as 800 or 888, usable for business texting after verification. Cheaper and quicker to get than a short code, but much slower to send from by default.

namespace:
  term: Namespace
  definition: A self-contained tree of files with its own owner and change history, such as one user's My Drive, one shared folder, or one shared drive. Changes inside a namespace are ordered; the namespace is also the unit we shard by.

durability-nines:
  term: Durability ("nines")
  definition: The probability that stored data survives a year without loss. 99.999999999% ("eleven nines") means that out of 100 billion stored objects, about one is expected to be lost per year.

read-your-writes:
  term: Read-your-writes consistency
  definition: A guarantee that once a client's write succeeds, that same client's later reads always see it, even if other clients may briefly see older data.

new-enemy-problem:
  term: New enemy problem
  definition: The failure where a permission check uses stale access rules and lets in someone who was just removed, for example seeing a file added after their access was revoked. Named in Google's Zanzibar paper.

resumable-upload:
  term: Resumable upload
  definition: An upload split into pieces under one session, so that after a dropped connection the client asks how much arrived and sends only the rest, instead of starting over.

content-addressed-storage:
  term: Content-addressed storage
  definition: Storing each piece of data under the hash of its own bytes. Identical content gets the same address, so it is stored once, and any corruption is detectable because the bytes no longer match their name.

blocklist:
  term: Blocklist
  definition: The ordered list of block hashes that makes up one version of a file. Reassembling the blocks in that order reproduces the file exactly.

content-defined-chunking:
  term: Content-defined chunking (CDC)
  definition: Splitting a file at boundaries chosen by its content (where a rolling hash of the last few bytes matches a pattern) instead of at fixed offsets, so an insertion only changes the chunks around it.

rolling-hash:
  term: Rolling hash
  definition: A hash over a sliding window of bytes that can be updated in constant time as the window moves forward one byte, which makes it cheap to evaluate at every position in a file.

change-journal:
  term: Change journal
  definition: An append-only, numbered log of every change to a namespace. Clients catch up by asking for all entries after the last number they processed.

sync-cursor:
  term: Sync cursor
  definition: A device's bookmark into a change journal, the number of the last change it has applied. Asking for changes after the cursor returns exactly what the device has missed.

optimistic-concurrency:
  term: Optimistic concurrency control
  definition: Letting writers proceed without locks and checking at commit time that the data has not changed since they read it (for example, that the file's head revision is still the one they edited). If it has, the commit is rejected.

merge-base:
  term: Merge base
  definition: The last state two copies agreed on. Comparing each copy with it tells you which side changed, which is what turns "these differ" into "this side edited, that side did not".

conflicted-copy:
  term: Conflicted copy
  definition: A second file created when two edits to the same file collide, so that neither edit is lost; for example "Report (Alice's conflicted copy).docx". A person decides how to merge them.

relation-tuple:
  term: Relation tuple
  definition: A permission fact of the form object, relation, subject, such as "folder:F has viewer group:eng". Access checks combine tuples, for example following a file to its parent folder and a group to its members.

consistency-token:
  term: Consistency token
  definition: An opaque value returned by a write that later reads present to say "evaluate at a state at least this recent". Zanzibar calls it a zookie; it is how a permission check avoids using rules older than the content it protects.

signed-url:
  term: Signed URL
  definition: A download or upload link that carries its own short-lived, tamper-proof authorization, so a storage server can serve it without calling back to the permission service.

erasure-coding:
  term: Erasure coding
  definition: Splitting data into k pieces and computing m extra parity pieces so that any k of the k + m can rebuild it. Reed-Solomon (10, 4), for example, survives the loss of any 4 pieces at 1.4× the original size, versus 3× for three full copies.

scrubbing:
  term: Scrubbing
  definition: Reading stored data in the background and checking it against its checksums to find silent corruption early, while enough healthy copies or parity remain to repair it.

mark-and-sweep:
  term: Mark-and-sweep garbage collection
  definition: Finding garbage by first marking everything still referenced, then deleting only what was not marked, instead of trusting reference counts that can drift under concurrency.

envelope-encryption:
  term: Envelope encryption
  definition: Encrypting data with a data key, then encrypting that data key with a key-encryption key held in a key-management service. Rotating or revoking the outer key never requires re-encrypting the data.

crypto-shredding:
  term: Crypto-shredding
  definition: Deleting data by destroying the key it was encrypted with. Every copy, replica, and backup becomes unreadable at once, even ones that are physically removed later.

hot-partition:
  term: Hot partition
  definition: One shard or partition that receives far more traffic than the others, usually because a single key is popular, so it saturates while the rest of the cluster sits idle.
